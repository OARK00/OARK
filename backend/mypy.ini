[mypy]
python_version = 3.11
files = app
plugins = pydantic.mypy

# Checks that pay for themselves on an existing codebase: they find real
# mistakes without demanding every function be annotated first.
check_untyped_defs = True
no_implicit_optional = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_return_any = True
