name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Vulnerabilities are found in packages long after we install them, so the
  # checks also run every Monday (08:30 India time) even with no new commits.
  schedule:
    - cron: '0 3 * * 1'

jobs:
  backend:
    runs-on: ubuntu-latest

    # A throwaway Postgres for this run only. Never the development or
    # production database: CI must be free to create and destroy anything.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: oark_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/oark_test
      JWT_SECRET: ci-only-secret-not-used-anywhere-else

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      # Every package we deploy and every dev tool, including the ones they
      # pull in, checked against known vulnerabilities. Any finding fails CI.
      - run: pip-audit -r requirements-dev.txt --progress-spinner off

      # Proves the migrations still build a database from nothing, which is
      # what a new deployment does.
      - run: alembic upgrade head
      - run: python label_database.py test

      - run: mypy
      - run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # low: any known vulnerability fails CI. Frontend code runs in every
      # customer's browser, so we would rather pause a push than ship a hole.
      - run: npm audit --audit-level=low

      - run: npm run build

  secrets:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth 0: the whole history, not just the last commit. A key
      # deleted in a later commit is still readable in the old one.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --redact: a finding is reported by file and line, never with the key
      # itself, because CI logs are readable by anyone with repo access.
      - run: >-
          docker run --rm --user "$(id -u):$(id -g)"
          -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1
          git /repo --redact --verbose
