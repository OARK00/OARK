<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Oark</title>
    <!-- Render's redirect rule normally sends visitors on before this page loads;
         this covers the case where the rule isn't configured. -->
    <meta http-equiv="refresh" content="0; url=https://app.oark.in" />
    <link rel="canonical" href="https://app.oark.in" />
    <script>
      window.location.replace("https://app.oark.in" + window.location.pathname + window.location.search);
    </script>
  </head>
  <body>
    <p>Oark has moved to <a href="https://app.oark.in">app.oark.in</a>.</p>
  </body>
</html>
